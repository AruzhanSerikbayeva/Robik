<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Робик және қуат — Санның квадраты және кубы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='8' width='44' height='36' rx='14' fill='%23fff' stroke='%23c3cfe0' stroke-width='3'/%3E%3Crect x='16' y='14' width='32' height='24' rx='10' fill='%23101827'/%3E%3Ccircle cx='26' cy='26' r='5' fill='none' stroke='%2346c8ff' stroke-width='3'/%3E%3Ccircle cx='38' cy='26' r='5' fill='none' stroke='%2346c8ff' stroke-width='3'/%3E%3Crect x='18' y='46' width='28' height='12' rx='6' fill='%23fff' stroke='%23c3cfe0' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="start">
<canvas id="bg" aria-hidden="true"></canvas>

<!-- ===================== ЖОҒАРҒЫ ПАНЕЛЬ ===================== -->
<header id="hud" class="hud off">
  <nav class="steps" id="steps" aria-label="Ойындар">
    <button class="step" data-g="1" type="button"><i>1</i><span>Сызба есеп</span></button>
    <button class="step" data-g="2" type="button"><i>2</i><span>Шытырман оқиға</span></button>
    <button class="step" data-g="3" type="button"><i>3</i><span>Ақиқат / жалған</span></button>
  </nav>
  <div class="bat" aria-live="polite">
    <div class="bat-robot" id="hud-robot"></div>
    <div class="bat-body">
      <div class="bat-label">Робиктің қуаты</div>
      <div class="bat-bar"><div class="bat-fill" id="bat-fill"></div><span class="bat-pct" id="bat-pct">10%</span></div>
    </div>
  </div>
  <div class="hud-r">
    <button id="b-pause" class="hbtn" type="button"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg><span>Тоқтату</span></button>
    <button id="b-finish" class="hbtn danger" type="button"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 21V4M6 5h12l-2.5 4L18 13H6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ойынды аяқтау</span></button>
    <button id="b-full" class="hbtn icon" type="button" title="Толық экран" aria-label="Толық экран"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="b-sound" class="hbtn icon" type="button" title="Дыбыс" aria-label="Дыбыс"><svg id="ic-sound" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
</header>

<main id="stage">

  <!-- ===================== БАСТАУ ===================== -->
  <section id="scr-start" class="screen on">
    <div class="start-card">
      <div class="start-kicker">Математика · қайталау сабағы</div>
      <h1>Санның квадраты<br>және кубы</h1>
      <p class="start-sub">Робикке қуат жинайық!</p>
      <button id="btn-start" class="btn xl green" type="button"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Бастау</button>
      <div class="start-tips">
        <span><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/></svg> Дыбысты қосыңыздар</span>
        <span><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg> F11 — толық экран</span>
      </div>
    </div>
  </section>

  <!-- ===================== КІРІСПЕ (Робик сөйлейді) ===================== -->
  <section id="scr-intro" class="screen">
    <div class="intro-wrap">
      <div class="robot-host intro-robot" id="intro-robot"></div>
      <div class="sub-card" id="intro-card">
        <div class="sub-name">Робик</div>
        <div class="sub-text" id="intro-text"></div>
        <div class="sub-foot">
          <div class="dots" id="intro-dots"></div>
          <button id="intro-skip" class="btn sm ghost" type="button">Өткізу<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 5l8 7-8 7zM16 5v14" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div class="poster-text" id="poster-text">
        <div class="poster-big">10%</div>
        <div class="poster-cap">Робиктің қуаты азайып кетті!<br>Бірге қуаттайық.</div>
        <button id="poster-go" class="btn xl green" type="button">Бастаймыз!<svg viewBox="0 0 24 24" width="28" height="28"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </section>

  <!-- ===================== 1-ОЙЫН: СЫЗБА ЕСЕП (6-тапсырма) ===================== -->
  <section id="scr-g1" class="screen game">
    <canvas id="g1-cv" class="scene"></canvas>
    <div class="g1-top">
      <div class="watch" id="g1-watch" aria-hidden="true">
        <div class="w-strap"></div>
        <div class="w-face"><div class="w-act" id="w-act">Смарт-сағат</div><div class="w-time"><b id="w-time">0</b><small>мин</small></div></div>
        <div class="w-strap"></div>
      </div>
      <div class="diagram" id="g1-diagram"></div>
    </div>
    <div class="g1-tag" id="g1-tag">1-есеп · 1 / 4</div>
    <button id="g1-speed" class="chip-btn" type="button"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 5l8 7-8 7zM12 5l8 7-8 7z" fill="currentColor"/></svg>Жылдамдату</button>
    <div class="qpanel" id="g1-panel"></div>
  </section>

  <!-- ===================== 2-ОЙЫН: ШЫТЫРМАН ОҚИҒА (7-тапсырма) ===================== -->
  <section id="scr-g2" class="screen game">
    <canvas id="g2-cv" class="scene"></canvas>
    <div class="g2-score" id="g2-score"></div>
    <div class="g2-prog" id="g2-prog"></div>
    <div class="qpanel" id="g2-panel"></div>
  </section>

  <!-- ===================== 3-ОЙЫН: АҚИҚАТ ПА, ЖАЛҒАН БА? (8-тапсырма) ===================== -->
  <section id="scr-g3" class="screen game3">
    <div class="g3-wrap">
      <div class="g3-top">
        <div class="pill"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 8v5l3 2M9.5 3h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><b id="g3-time">60</b> с</div>
        <div class="pill gold"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="currentColor"/></svg><b id="g3-score">0</b></div>
        <div class="pill hot"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3-1-4 0-7 1-10z" fill="currentColor"/></svg><b id="g3-streak">0</b></div>
      </div>
      <div class="g3-bar"><div id="g3-barfill"></div></div>
      <div class="g3-card" id="g3-card"><div class="g3-stmt" id="g3-stmt"></div></div>
      <div class="g3-btns">
        <button id="g3-true" class="btn xl green" type="button"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 13l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Ақиқат</button>
        <button id="g3-false" class="btn xl red" type="button"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>Жалған</button>
      </div>
      <div id="g3-fb" class="g3-fb" aria-live="polite"></div>
      <button id="g3-end" class="btn md ghost g3-endbtn" type="button"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 21V4M6 5h12l-2.5 4L18 13H6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Ойынды аяқтау</button>
      <div class="g3-start" id="g3-start"></div>
    </div>
  </section>

  <!-- ===================== ҚОРЫТЫНДЫ: РОБИК ТОЛЫҚ ЗАРЯДТАЛДЫ ===================== -->
  <section id="scr-end" class="screen">
    <div class="end-wrap">
      <div class="robot-host end-robot" id="end-robot"></div>
      <div class="end-right">
        <div class="recap" id="recap">
          <button class="rc sq" type="button" id="rc-sq"><span class="rc-h">Санның квадраты деген не?</span><span class="rc-a"><b>n² = n · n</b><em>Санды өзіне көбейтеміз</em><em class="ex">5² = 5 · 5 = 25</em></span></button>
          <button class="rc cu" type="button" id="rc-cu"><span class="rc-h">Санның кубы деген не?</span><span class="rc-a"><b>n³ = n · n · n</b><em>Санды үш рет көбейтеміз</em><em class="ex">3³ = 3 · 3 · 3 = 27</em></span></button>
        </div>
        <div class="hands" id="hands"><svg viewBox="0 0 64 64" width="64" height="64"><path d="M22 58V30l-5-9a3 3 0 015-3l5 8V10a3 3 0 016 0v16l1-18a3 3 0 016 0l-1 18 2-14a3 3 0 016 1l-3 22 7-9a3 3 0 015 3l-9 20z" fill="#ffd5b3" stroke="#22344f" stroke-width="2.4" stroke-linejoin="round"/></svg><span>Қолдарыңды жоғары көтер!</span></div>
        <div class="sub-card end-sub" id="end-card">
          <div class="sub-name">Робик</div>
          <div class="sub-text" id="end-text"></div>
          <div class="sub-foot">
            <div class="dots" id="end-dots"></div>
            <button id="end-skip" class="btn sm ghost" type="button">Өткізу<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 5l8 7-8 7zM16 5v14" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <div class="end-actions" id="end-actions">
          <button id="end-again" class="btn md blue" type="button"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 12a8 8 0 108-8H8M8 1L4 4l4 3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Басынан бастау</button>
          <button id="end-full" class="btn md ghost" type="button">Толық экран</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- Ойындағы шағын Робик -->
<div id="companion" class="comp off" aria-live="polite">
  <div class="robot-host comp-robot" id="comp-robot"></div>
  <div class="bubble" id="comp-bubble"></div>
</div>

<!-- Терезелер: үзіліс, нәтиже, растау -->
<div id="overlay" class="overlay off" role="dialog" aria-modal="true"><div class="ov-card" id="ov-card"></div></div>

<canvas id="fx" aria-hidden="true"></canvas>

<script charset="utf-8" src="voice_lines.js"></script>
<script charset="utf-8" src="core.js"></script>
<script charset="utf-8" src="robot.js"></script>
<script charset="utf-8" src="art.js"></script>
<script charset="utf-8" src="game.js"></script>
</body>
</html>
